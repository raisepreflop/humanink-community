<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ebook Cover</title>
<style>
/* KDP ebook: 1600x2560px → scaled to 6.667" x 8.533" at 300 DPI */
/* In HTML we use the exact 1:1.6 ratio */
@page {
  size: 152.4mm 243.84mm; /* 6" × 9.6" — 1:1.6 ratio */
  margin: 0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 152.4mm;
  height: 243.84mm;
  font-family: Georgia, serif;
  overflow: hidden;
  background: #1a1a2e; /* Customize with the color of the chosen concept */
}
.ebook-cover {
  width: 100%; height: 100%;
  position: relative; overflow: hidden;
}
.ebook-img {
  width: 100%; height: 100%;
  object-fit: cover; position: absolute; top: 0; left: 0;
}
.img-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a1a4e 0%, #2d2d7a 50%, #4a1a6e 100%);
  display: flex; align-items: center; justify-content: center;
}
.img-placeholder span {
  color: rgba(255,255,255,0.25); font-size: 14pt;
  text-transform: uppercase; letter-spacing: 0.2em; text-align: center; padding: 10mm;
}
.ebook-gradient {
  position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
  padding: 10mm 8mm;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.ebook-titulo {
  font-size: 28pt; font-weight: bold; color: white;
  text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1;
  margin-bottom: 4mm; text-shadow: 0 2px 8px rgba(0,0,0,0.95);
}
.ebook-autor {
  font-size: 13pt; color: rgba(255,255,255,0.82);
  letter-spacing: 0.15em; text-transform: uppercase; font-style: italic;
}
</style>
</head>
<body>
<div class="ebook-cover">
  <div class="img-placeholder"><span>COVER IMAGE<br>1600 × 2560 px</span></div>
  <div class="ebook-gradient">
    <div class="ebook-titulo">BOOK TITLE</div>
    <div class="ebook-autor">AUTHOR NAME</div>
  </div>
</div>
</body>
</html>
